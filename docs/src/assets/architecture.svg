<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">
<title>powerio_architecture</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/></marker></defs>
<rect width="960" height="620" fill="#f4f6f8"/>
<g font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1a202c" stroke="#4a5568">
  <rect x="20" y="25" width="920" height="560" rx="12" fill="#f4f6f8"/>
  <text x="40" y="52" font-size="16" font-weight="bold" stroke="none">PowerIO architecture</text>

  <g id="consumers" fill="#ffffff">
    <title>cluster_consumers</title>
    <rect x="40" y="75" width="260" height="100" rx="10"/>
    <text x="60" y="98" stroke="none" font-size="11">representative consumers</text>
    <rect x="55" y="112" width="110" height="45" rx="7"/>
    <title>solvers</title>
    <text x="110" y="132" text-anchor="middle" stroke="none">solvers</text>
    <text x="110" y="147" text-anchor="middle" stroke="none" font-size="9">Tellegen / ExaModelsPower</text>
    <rect x="180" y="112" width="105" height="45" rx="7"/>
    <title>gridfm_ml</title>
    <text x="232" y="138" text-anchor="middle" stroke="none">GridFM pipeline</text>
  </g>

  <g fill="#f4f6f8">
    <rect x="360" y="80" width="250" height="65" rx="10"/><title>powerio</title>
    <text x="485" y="105" text-anchor="middle" stroke="none" font-weight="bold">powerio (facade)</text>
    <text x="485" y="123" text-anchor="middle" stroke="none" font-size="10">parse, emit, serialize, deserialize, PioValue</text>

    <rect x="660" y="80" width="250" height="65" rx="10"/><title>powerio&#45;synth</title>
    <text x="785" y="105" text-anchor="middle" stroke="none" font-weight="bold">powerio-synth</text>
    <text x="785" y="123" text-anchor="middle" stroke="none" font-size="10">deterministic synthetic cases</text>

    <rect x="55" y="235" width="210" height="65" rx="10"/><title>powerio&#45;cli</title>
    <text x="160" y="260" text-anchor="middle" stroke="none" font-weight="bold">powerio-cli</text>
    <text x="160" y="278" text-anchor="middle" stroke="none" font-size="10">CLI + TUI</text>

    <rect x="375" y="235" width="210" height="65" rx="10"/><title>powerio&#45;capi</title>
    <text x="480" y="260" text-anchor="middle" stroke="none" font-weight="bold">powerio-capi</text>
    <text x="480" y="278" text-anchor="middle" stroke="none" font-size="10">C ABI 7 (Julia, C, C++)</text>

    <rect x="695" y="235" width="210" height="65" rx="10"/><title>powerio&#45;py</title>
    <text x="800" y="260" text-anchor="middle" stroke="none" font-weight="bold">powerio-py</text>
    <text x="800" y="278" text-anchor="middle" stroke="none" font-size="10">Python package + MCP</text>

    <rect x="55" y="380" width="210" height="65" rx="10"/><title>powerio&#45;matrix</title>
    <text x="160" y="405" text-anchor="middle" stroke="none" font-weight="bold">powerio-matrix</text>
    <text x="160" y="423" text-anchor="middle" stroke="none" font-size="10">sparse matrices, graph data</text>

    <rect x="375" y="380" width="210" height="65" rx="10"/><title>powerio&#45;prob</title>
    <text x="480" y="405" text-anchor="middle" stroke="none" font-weight="bold">powerio-prob</text>
    <text x="480" y="423" text-anchor="middle" stroke="none" font-size="10">operating points, instances, solutions</text>

    <rect x="695" y="380" width="210" height="65" rx="10"/><title>powerio&#45;tx</title>
    <text x="800" y="405" text-anchor="middle" stroke="none" font-weight="bold">powerio-tx</text>
    <text x="800" y="423" text-anchor="middle" stroke="none" font-size="10">BalancedNetwork + formats</text>

    <rect x="220" y="505" width="210" height="65" rx="10"/><title>powerio&#45;dist</title>
    <text x="325" y="530" text-anchor="middle" stroke="none" font-weight="bold">powerio-dist</text>
    <text x="325" y="548" text-anchor="middle" stroke="none" font-size="10">MulticonductorNetwork + OpenDSS</text>

    <rect x="530" y="505" width="210" height="65" rx="10"/><title>powerio&#45;core</title>
    <text x="635" y="530" text-anchor="middle" stroke="none" font-weight="bold">powerio-core</text>
    <text x="635" y="548" text-anchor="middle" stroke="none" font-size="10">Source, Diagnostic, Error, PioModule&lt;T&gt;</text>
  </g>

  <g fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M785 145 L485 145"/><title>powerio&#45;synth&#45;&gt;powerio</title>
    <path d="M160 235 L410 145"/><title>powerio&#45;cli&#45;&gt;powerio</title>
    <path d="M480 235 L485 145"/><title>powerio&#45;capi&#45;&gt;powerio</title>
    <path d="M800 235 L560 145"/><title>powerio&#45;py&#45;&gt;powerio</title>
    <path d="M485 145 L160 380"/><title>powerio&#45;&gt;powerio&#45;matrix</title>
    <path d="M485 145 L480 380"/><title>powerio&#45;&gt;powerio&#45;prob</title>
    <path d="M485 145 L800 380"/><title>powerio&#45;&gt;powerio&#45;tx</title>
    <path d="M485 145 L325 505"/><title>powerio&#45;&gt;powerio&#45;dist</title>
    <path d="M160 445 L325 505"/><title>powerio&#45;matrix&#45;&gt;powerio&#45;dist</title>
    <path d="M160 445 L480 380"/><title>powerio&#45;matrix&#45;&gt;powerio&#45;prob</title>
    <path d="M160 445 L800 380"/><title>powerio&#45;matrix&#45;&gt;powerio&#45;tx</title>
    <path d="M160 445 L635 505"/><title>powerio&#45;matrix&#45;&gt;powerio&#45;core</title>
    <path d="M480 445 L800 380"/><title>powerio&#45;prob&#45;&gt;powerio&#45;tx</title>
    <path d="M480 445 L325 505"/><title>powerio&#45;prob&#45;&gt;powerio&#45;dist</title>
    <path d="M480 445 L635 505"/><title>powerio&#45;prob&#45;&gt;powerio&#45;core</title>
    <path d="M800 445 L635 505"/><title>powerio&#45;tx&#45;&gt;powerio&#45;core</title>
    <path d="M325 570 L635 570"/><title>powerio&#45;dist&#45;&gt;powerio&#45;core</title>
  </g>
  <g fill="none" stroke="#4a5568" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow)">
    <path d="M165 157 L430 380"/><title>solvers&#45;&gt;powerio&#45;prob</title>
    <path d="M232 157 L190 380"/><title>gridfm_ml&#45;&gt;powerio&#45;matrix</title>
    <path d="M485 145 L160 380"/><title>powerio&#45;&gt;powerio&#45;matrix</title>
  </g>
</g>
</svg>
