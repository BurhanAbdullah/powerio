[package]
name = "powerio-matrix"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Sparse matrices and graph outputs for power system case files, built on powerio."
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/powerio-matrix"
keywords = ["matpower", "sparse", "ptdf", "dc-opf"]
categories = ["science", "mathematics"]

[package.metadata.docs.rs]
all-features = true

[features]
gridfm = ["dep:arrow", "dep:parquet"]

[lib]
name = "powerio_matrix"
path = "src/lib.rs"

[dependencies]
powerio-core = { workspace = true }
powerio-dist.workspace = true
powerio-prob.workspace = true
powerio-tx.workspace = true
thiserror = "2"
sprs.workspace = true
faer.workspace = true
num-complex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
rustc-hash = "2"
arrow = { workspace = true, optional = true }
parquet = { version = "59", default-features = false, features = ["arrow", "snap"], optional = true }
rand = { version = "0.9.5", default-features = false, features = ["std"] }
rand_chacha = { version = "0.9.0", default-features = false, features = ["std"] }

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
powerio-dist.workspace = true
powerio-synth.workspace = true
tempfile = "3"

[[bench]]
name = "matrix"
harness = false

[lints]
workspace = true
