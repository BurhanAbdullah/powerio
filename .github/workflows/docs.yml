name: Docs

on:
  pull_request:

# PRs validate the full documentation build. Publishing runs in the separate
# Docs Deploy workflow on main/dispatch, so PR validation has no deploy steps.

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/docs-build.yml
