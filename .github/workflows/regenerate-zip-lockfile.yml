name: Regenerate ZIP lockfile

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - repair/pr588-synth-main

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate lockfile using Cargo
        run: cargo update -p zip
      - name: Upload Cargo-generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lockfile
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
