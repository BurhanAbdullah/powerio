name: Regenerate locked dependencies
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/pr588-synth-main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate Cargo.lock for the declared ZIP version
        run: |
          cargo update -p zip
          cargo check --workspace --all-targets --locked
      - name: Remove temporary workflow
        run: rm .github/workflows/regenerate-zip8-lockfile.yml
      - name: Commit lockfile if resolution succeeds
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(deps): regenerate lockfile for ZIP 8.x"
          git push origin HEAD:repair/pr588-synth-main
