name: Temporary Parquet lockfile regeneration

on:
  push:
    branches: [fix/parquet-rustsec-2026-0595]
    paths:
      - .github/workflows/temporary-parquet-lock-update.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/parquet-rustsec-2026-0595
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Update patched Parquet
        run: cargo update -p parquet --precise 60.2.0
      - name: Confirm resolved version
        run: |
          cargo tree -i parquet
          cargo tree -i parquet | grep -q 'parquet v60.2.0'
      - name: Check advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
      - name: Compile gridfm dependency feature
        run: cargo check --locked -p powerio-matrix --features gridfm
      - name: Commit lockfile update
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "fix(deps): update parquet to patched 60.2.0"
          git push origin fix/parquet-rustsec-2026-0595
