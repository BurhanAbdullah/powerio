name: Temporary Parquet lockfile regeneration

on:
  push:
    branches: [fix/parquet-rustsec-2026-0595]

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Update patched Parquet
        run: cargo update -p parquet --precise 60.2.0
      - name: Confirm resolved version
        run: |
          cargo tree -i parquet
          cargo tree -i parquet | grep -q 'parquet v60.2.0'
      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parquet-patched-lockfile
          path: Cargo.lock
          if-no-files-found: error
      - name: Check advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
      - name: Compile gridfm dependency feature
        run: cargo check --locked -p powerio-matrix --features gridfm
