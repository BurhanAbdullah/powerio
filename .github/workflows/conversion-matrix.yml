name: Conversion Matrix

on:
  pull_request:

# One run per workflow per branch. A force push to a stacked pull request
# otherwise leaves the superseded run going: it finishes, it fails or it
# passes, and it emails every watcher a second time for a commit nobody is
# reviewing.
#
# Only a pull request run is ever superseded, so only a pull request run is
# cancelled. A push to `main` is a release candidate whose result must stand
# on its own, and a release run is the release itself: `python.yml` publishes
# wheels to PyPI from one, behind an environment whose reviewer gate can hold
# it for a long time. Keying the switch on the ref instead would make every
# tag run cancellable, and a re-published release or a re-run of the same tag
# would then cancel a publish in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  POWERIO_CONVERSION_MATRIX_REPORT: ${{ github.workspace }}/target/conversion-matrix-report.md
  POWERIO_CONVERSION_MATRIX_DETAILS: ${{ github.workspace }}/target/conversion-matrix-warning-details.md

jobs:
  report:
    # A Dependabot pull request does not run the matrix: the job takes 3 to 10
    # minutes and finishes by posting its report as a comment on the pull request.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
    - name: Generate conversion matrix
      run: cargo test -p powerio-cli --test conversion_matrix_report -- --nocapture
    - name: Upload warning details
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: conversion-matrix-warning-details
        path: ${{ env.POWERIO_CONVERSION_MATRIX_DETAILS }}
        if-no-files-found: ignore
    - name: Add conversion matrix report to workflow summary
      if: always()
      shell: bash
      run: |
        if [ -f "$POWERIO_CONVERSION_MATRIX_REPORT" ]; then
          cat "$POWERIO_CONVERSION_MATRIX_REPORT" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "## Conversion Matrix" >> "$GITHUB_STEP_SUMMARY"
          echo "Matrix generation failed before writing the report. See the workflow logs." >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ -f "$POWERIO_CONVERSION_MATRIX_DETAILS" ]; then
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Detailed warning data is attached as the `conversion-matrix-warning-details` workflow artifact." >> "$GITHUB_STEP_SUMMARY"
        fi
