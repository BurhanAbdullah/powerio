name: Python Publish

# Publish only artifacts from a successful Python release build. PR workflows do
# not invoke this workflow, and no publishing step is conditionally skipped.
on:
  workflow_run:
    workflows: ["Python"]
    types: [completed]
    branches: ["v*"]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Python release workflow run ID to publish
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    name: publish verified release artifacts to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
    steps:
      - name: Verify successful stable-release build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_json="$RUNNER_TEMP/python-run.json"
          curl --fail --silent --show-error --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" \
            -o "$run_json"
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .name == "Python" and
            .conclusion == "success" and
            (.event == "release" or .event == "workflow_dispatch") and
            .head_repository.full_name == $repo and
            (.head_branch | startswith("v"))
          ' "$run_json" >/dev/null || {
            echo "Refusing to publish: source run is not a successful Python release build from this repository." >&2
            exit 1
          }
          tag="$(jq -r '.head_branch' "$run_json")"
          release_json="$RUNNER_TEMP/release.json"
          curl --fail --silent --show-error --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            -o "$release_json"
          jq -e '.draft == false and .prerelease == false' "$release_json" >/dev/null || {
            echo "Refusing to publish draft or prerelease $tag." >&2
            exit 1
          }
      - name: Download artifacts from the verified Python run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Validate release distributions
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
