name: Temporary canonical lock export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate canonical dependency graph
        run: |
          cargo update -p zip -p private-gemm-x86
          echo LOCKFILE_BEGIN
          cat Cargo.lock
          echo LOCKFILE_END
