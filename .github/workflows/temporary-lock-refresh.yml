name: Temporary dependency lock refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Refresh patched dependencies
        run: cargo update -p zip -p private-gemm-x86
      - uses: actions/upload-artifact@v4
        with:
          name: refreshed-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
