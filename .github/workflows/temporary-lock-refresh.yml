name: Temporary lockfile regeneration

on:
  push:
    branches:
      - feat/fuzz-ieee-cdf-reader

permissions:
  contents: write

jobs:
  regenerate-lock:
    if: contains(github.event.head_commit.message, '[regenerate-lock]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fuzz-ieee-cdf-reader
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate dependency lock entries
        run: cargo update -p zip -p private-gemm-x86
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "fix(deps): regenerate lockfile for patched dependencies"
          git push origin HEAD:feat/fuzz-ieee-cdf-reader
