[package]
name = "powerio-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Browser bindings for local PowerIO file conversion"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
powerio.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.128"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Link the optional JavaScript host callbacks required by sqlite-wasm-rs.
sqlite-wasm-rs = { version = "0.6.2", features = ["wasm-bindgen"] }

[dev-dependencies]
rusqlite.workspace = true

[lints]
workspace = true
