[package]
name = "powerio-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Browser bindings for local PowerIO file conversion"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
powerio.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.128"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dev-dependencies]
rusqlite.workspace = true

[lints]
workspace = true

# Keep rusqlite's browser backend on the JS-hosted adapter required by
# the wasm-bindgen conversion runtime. sqlite-wasm-rs 0.6 no longer exports
# the host callbacks used by this component.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
sqlite-wasm-rs = { version = "=0.5.5", default-features = false }
